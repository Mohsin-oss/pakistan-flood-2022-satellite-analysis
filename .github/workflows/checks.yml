name: Static and CSV checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: node tests/check_js.js
      - run: python -m unittest discover -s tests
      - run: python src/audit.py recovery results/tables/stage5_*_recovery_matched.csv
      - run: python scripts/verify_results.py
